# Scope CodeQL to the platform app inside the monorepo.
#
name: "Platform CodeQL"

paths:
  - apps/platform

paths-ignore:
  - apps/platform/vendor
  - apps/platform/node_modules
  - apps/platform/public/build
  - apps/platform/bootstrap/cache
  - apps/platform/storage
  - apps/platform/**/*.blade.php
  - apps/platform/**/*.php
  - "**/*.min.js"
