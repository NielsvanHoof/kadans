name: Platform CI

on:
  pull_request:
    paths:
      - "apps/platform/**"
      - ".github/workflows/platform.yml"
      - ".github/actions/setup-platform-php/**"
  push:
    branches:
      - main
    paths:
      - "apps/platform/**"
      - ".github/workflows/platform.yml"
      - ".github/actions/setup-platform-php/**"

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/platform

env:
  PHP_VERSION: "8.5"
  NODE_VERSION: "24"

# The suite runs ONCE, split across four time-balanced Pest shards. Each shard
# writes `--coverage-php` and the `coverage-gate` job merges them to enforce the
# line floor — see scripts/coverage-gate.php. Do not add a job that runs the
# whole suite again to measure coverage.
jobs:
  # Deliberately thin. The Pest shards need the Vite manifest and nothing else
  # (tests/TestCase.php pins Vite to built-manifest mode), so keeping the static
  # gates out of this job is what lets the shards start without waiting on them.
  build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      # `npm run build` needs a working artisan: vite.config.ts loads the
      # Wayfinder plugin, which shells out to `artisan wayfinder:generate`.
      - name: Set up PHP
        uses: ./.github/actions/setup-platform-php
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.18.0
        with:
          working-directory: apps/platform
          node-version: ${{ env.NODE_VERSION }}
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Prepare the application
        run: |
          cp .env.ci .env
          php artisan key:generate --no-interaction

      - name: Build frontend assets
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v7
        with:
          name: platform-frontend-build
          path: apps/platform/public/build
          retention-days: 1
          if-no-files-found: error

  # PHP static gates only (composer audit, lang, rector, pint, phpstan). Node is
  # installed because `security:check` also runs `npm audit`.
  quality:
    name: Application quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: ./.github/actions/setup-platform-php
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.18.0
        with:
          working-directory: apps/platform
          node-version: ${{ env.NODE_VERSION }}
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Prepare the application
        run: |
          cp .env.ci .env
          php artisan key:generate --no-interaction

      - name: Run static quality gates
        run: composer ci:static

  # Frontend type generation, lint/format, and the frontend coverage floor. This
  # is the ONLY place `npm run test:coverage` runs.
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: ./.github/actions/setup-platform-php
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.18.0
        with:
          working-directory: apps/platform
          node-version: ${{ env.NODE_VERSION }}
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Prepare the application
        run: |
          cp .env.ci .env
          php artisan key:generate --no-interaction

      # Regenerates the committed TypeScript, then type checks it.
      - name: Check types
        run: npm run types:check

      # The step above regenerates these; any change means the committed output
      # is stale. Uses status --porcelain rather than `diff` so a generated file
      # that was never committed is caught too, not just a modified one.
      - name: Fail on stale generated TypeScript
        run: |
          paths="resources/js/types/generated resources/js/features/document-requests/item-types/generated.ts"
          changed=$(git status --porcelain -- $paths)
          if [ -n "$changed" ]; then
            echo "Generated TypeScript is out of date or uncommitted:"
            echo "$changed"
            git diff -- $paths
            exit 1
          fi

      - name: Check formatting and lint
        run: npm run check

      # Line floor lives in vite.config.ts test.coverage (excludes generated + shadcn ui).
      - name: Enforce the frontend coverage threshold
        run: npm run test:coverage

  # Time-balanced via committed tests/.pest/shards.json. Refresh with
  # `composer test:shards:update` when the suite shape changes a lot.
  # Use pest directly — `artisan test --parallel --shard` currently fails
  # forwarding PHPUnit's --runner option under Pest 5.
  tests:
    name: Pest (shard ${{ matrix.shard }}/4)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: ./.github/actions/setup-platform-php
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: pcov

      - name: Download frontend build
        uses: actions/download-artifact@v8
        with:
          name: platform-frontend-build
          path: apps/platform/public/build

      - name: Prepare the application
        run: |
          cp .env.ci .env
          php artisan key:generate --no-interaction

      # `--coverage-php` activates collection without rendering the per-file
      # table, so the shard pays for pcov but not for the report.
      - name: Run Pest shard
        run: |
          mkdir -p coverage-shards
          php vendor/bin/pest --parallel --ci \
            --shard=${{ matrix.shard }}/4 \
            --coverage-php=coverage-shards/shard-${{ matrix.shard }}.cov

      - name: Upload shard coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: apps/platform/coverage-shards/shard-${{ matrix.shard }}.cov
          retention-days: 1
          if-no-files-found: error

  # No single shard sees the whole app, so the floor is only meaningful once the
  # four shards are merged. Fails under the --min threshold (currently 87%).
  coverage-gate:
    name: PHP coverage gate
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: ./.github/actions/setup-platform-php
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Download shard coverage
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-shard-*
          merge-multiple: true
          path: apps/platform/coverage-shards

      # --expect=4 fails on a missing shard rather than reporting the resulting
      # dip as a genuine coverage regression.
      - name: Enforce the PHP coverage threshold
        run: php scripts/coverage-gate.php --min=87 --expect=4 coverage-shards/*.cov

  postgres-migrations:
    name: PostgreSQL migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: testing
      APP_KEY: base64:MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      CACHE_STORE: array
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: qompose_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      MAIL_MAILER: array
      OCR_DRIVER: mock
      QUEUE_CONNECTION: sync
      SCOUT_DRIVER: collection
      SESSION_DRIVER: array

    services:
      postgres:
        # Must ship pgvector — see .ai/rules/workflows.md.
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: qompose_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qompose_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: ./.github/actions/setup-platform-php
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, intl, mbstring, pcntl, pdo_pgsql, zip

      - name: Test clean PostgreSQL migrations
        run: php artisan migrate:fresh --force --no-interaction

      - name: Test the latest migration rollback
        run: |
          php artisan migrate:rollback --step=1 --force --no-interaction
          php artisan migrate --force --no-interaction
          php artisan migrate:status --no-interaction
