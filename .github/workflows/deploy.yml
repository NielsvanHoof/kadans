name: Deploy platform infra

# Infrastructure only: a knob change, a new alarm, a resize, a rollback via
# `imageTag`. It does NOT build or push an image, so on its own it can never move
# the running code forward — release.yml is the workflow that ships a commit.

on:
  workflow_dispatch:
    inputs:
      stack:
        description: Pulumi stack to deploy
        type: choice
        required: true
        default: staging
        options:
          - staging
          - production

permissions:
  contents: read
  id-token: write

# Per stack, so a staging deploy never queues behind a production one — and two
# runs against the same stack never race for the Pulumi lock.
concurrency:
  group: deploy-infra-${{ inputs.stack }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.stack }} stack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Names the GitHub Environment whose OIDC subject the deploy role trusts, so a
    # staging run is structurally incapable of assuming production's role.
    environment: ${{ inputs.stack }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL || 'https://api.pulumi.com' }}
      STACK: ${{ inputs.stack }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Configure AWS workload identity
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install infrastructure dependencies
        working-directory: apps/platform/infra
        run: npm ci

      # The stack tests run against Pulumi's mock runtime, so they need no
      # credentials and catch a broken program before it reaches AWS half-applied.
      - name: Verify the program
        working-directory: apps/platform/infra
        run: npm test

      - name: Select Pulumi stack
        working-directory: apps/platform/infra
        run: |
          npx pulumi login "$PULUMI_BACKEND_URL"
          if ! npx pulumi stack select "$STACK" --non-interactive; then
            npx pulumi stack init "$STACK" --non-interactive
          fi

      - name: Configure and deploy
        working-directory: apps/platform/infra
        env:
          ALARM_EMAIL_ADDRESS: ${{ vars.ALARM_EMAIL_ADDRESS }}
          ALARM_SMS_NUMBER: ${{ vars.ALARM_SMS_NUMBER }}
          APP_KEY: ${{ secrets.APP_KEY }}
          CACHE_AUTH_TOKEN: ${{ secrets.CACHE_AUTH_TOKEN }}
          HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
          IMAGE_TAG: ${{ vars.IMAGE_TAG }}
          ORIGIN_VERIFY_SECRET: ${{ secrets.ORIGIN_VERIFY_SECRET }}
          REVERB_APP_ID: ${{ secrets.REVERB_APP_ID }}
          REVERB_APP_SECRET: ${{ secrets.REVERB_APP_SECRET }}
          REVERB_PUBLIC_KEY: ${{ vars.REVERB_PUBLIC_KEY }}
          SENTRY_BROWSER_DSN: ${{ vars.SENTRY_BROWSER_DSN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          WAF_ENABLED: ${{ vars.WAF_ENABLED }}
        run: |
          npx pulumi config set aws:region "$AWS_REGION"

          if [ -n "$ALARM_EMAIL_ADDRESS" ]; then
            npx pulumi config set alarmEmailAddress "$ALARM_EMAIL_ADDRESS"
          else
            npx pulumi config rm alarmEmailAddress || true
          fi

          # Only the page-worthy alarms are worth a text; unset leaves email only.
          if [ -n "$ALARM_SMS_NUMBER" ]; then
            npx pulumi config set alarmSmsNumber "$ALARM_SMS_NUMBER"
          else
            npx pulumi config rm alarmSmsNumber || true
          fi

          # Optional: without it the stack still builds the certificate and exports
          # the records to create by hand, rather than blocking on ACM validation.
          if [ -n "$HOSTED_ZONE_ID" ]; then
            npx pulumi config set hostedZoneId "$HOSTED_ZONE_ID"
          fi

          # The ECR repository is tag-immutable, so this is a specific build.
          # Rolling back is setting this to an older SHA, not reverting a commit.
          if [ -n "$IMAGE_TAG" ]; then
            npx pulumi config set imageTag "$IMAGE_TAG"
          fi

          # The escape hatch for a managed WAF rule refusing legitimate traffic.
          # Unset leaves the environment's own setting in place.
          if [ -n "$WAF_ENABLED" ]; then
            npx pulumi config set wafEnabled "$WAF_ENABLED"
          fi

          : "${APP_KEY:?APP_KEY must be configured}"
          : "${REVERB_APP_ID:?REVERB_APP_ID must be configured}"
          : "${REVERB_APP_SECRET:?REVERB_APP_SECRET must be configured}"
          : "${SENTRY_DSN:?SENTRY_DSN must be configured}"
          : "${CACHE_AUTH_TOKEN:?CACHE_AUTH_TOKEN must be configured}"
          : "${REVERB_PUBLIC_KEY:?REVERB_PUBLIC_KEY must be configured}"
          : "${SENTRY_BROWSER_DSN:?SENTRY_BROWSER_DSN must be configured}"

          npx pulumi config set --secret appKey "$APP_KEY"
          npx pulumi config set --secret reverbAppId "$REVERB_APP_ID"
          npx pulumi config set --secret reverbAppSecret "$REVERB_APP_SECRET"
          npx pulumi config set --secret sentryDsn "$SENTRY_DSN"
          npx pulumi config set --secret cacheAuthToken "$CACHE_AUTH_TOKEN"

          # These must remain plain config — Vite embeds them in the browser bundle.
          npx pulumi config set reverbPublicKey "$REVERB_PUBLIC_KEY"
          npx pulumi config set sentryBrowserDsn "$SENTRY_BROWSER_DSN"

          if [ "$STACK" = "production" ]; then
            : "${ORIGIN_VERIFY_SECRET:?ORIGIN_VERIFY_SECRET must be configured for production}"
            npx pulumi config set --secret originVerifySecret "$ORIGIN_VERIFY_SECRET"
          else
            npx pulumi config rm originVerifySecret || true
          fi

          npm run up -- --yes --non-interactive

      - name: Report outputs
        working-directory: apps/platform/infra
        run: |
          {
            echo "### ${STACK} stack outputs"
            echo ""
            echo "- App hostname: \`$(npx pulumi stack output appHostname)\`"
            echo "- Load balancer: \`$(npx pulumi stack output loadBalancerDnsName)\`"
            echo "- Image repository: \`$(npx pulumi stack output containerRepositoryUrl)\`"
            echo "- Cluster: \`$(npx pulumi stack output clusterName)\`"
            echo "- Documents bucket: \`$(npx pulumi stack output documentsBucketName)\`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo ""
          echo "DNS records to create (empty when hostedZoneId is set):"
          npx pulumi stack output dnsRecordsToCreate || true
