expose_php=Off
display_errors=Off
log_errors=On
error_log=/proc/self/fd/2
memory_limit=256M
; Match DocumentUploadLimits: 20 MB per file, up to 10 files (~200 MB) + overhead.
upload_max_filesize=20M
post_max_size=210M
max_execution_time=120
opcache.enable=1
opcache.enable_cli=1
opcache.validate_timestamps=0
opcache.jit=off
realpath_cache_size=4096K
realpath_cache_ttl=600
session.cookie_httponly=1
session.cookie_secure=1
session.cookie_samesite=Lax
; Staging carries Xdebug so a live issue can be profiled without a rebuild, but
; it stays inert: Xdebug reads the XDEBUG_MODE environment variable and that
; overrides this line, so restart the task with XDEBUG_MODE=profile to arm it.
; display_errors stays Off — staging is reachable and shared, exactly like prod.
xdebug.mode=off
