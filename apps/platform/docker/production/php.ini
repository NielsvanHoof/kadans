expose_php=Off
display_errors=Off
log_errors=On
error_log=/proc/self/fd/2
memory_limit=256M
; Must cover the largest per-file validation ceiling: AudioUploadLimits is
; 25 MB, DocumentUploadLimits 20 MB up to 10 files (~200 MB) + overhead.
; Below it PHP drops the part with UPLOAD_ERR_INI_SIZE and no 413 (TASK-42).
upload_max_filesize=25M
post_max_size=210M
max_execution_time=120
opcache.enable=1
opcache.enable_cli=1
opcache.validate_timestamps=0
opcache.jit=off
realpath_cache_size=4096K
realpath_cache_ttl=600
session.cookie_httponly=1
session.cookie_secure=1
session.cookie_samesite=Lax
