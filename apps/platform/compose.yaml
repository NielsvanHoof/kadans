services:
    laravel.test:
        build:
            context: './docker/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
            # Reverb WebSocket server (artisan reverb:start / artisan dev)
            - '${FORWARD_REVERB_PORT:-8080}:8080'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            OCTANE_SERVER: frankenphp
            OCTANE_WORKERS: '${OCTANE_WORKERS:-2}'
            OCTANE_MAX_REQUESTS: '${OCTANE_MAX_REQUESTS:-500}'
            OCTANE_MAX_EXECUTION_TIME: '${OCTANE_MAX_EXECUTION_TIME:-120}'
            SUPERVISOR_PHP_COMMAND: '/usr/bin/php -d variables_order=EGPCS /var/www/html/artisan octane:start --server=frankenphp --host=0.0.0.0 --port=80 --admin-port=2019 --watch --poll --caddyfile=/var/www/html/docker/8.5/Caddyfile'
            XDG_CONFIG_HOME: /tmp/caddy/config
            XDG_DATA_HOME: /tmp/caddy/data
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
            - 'sail-node-modules:/var/www/html/node_modules'
        networks:
            - sail
        depends_on:
            - pgsql
            - redis
            - mailpit
            - floci
    pgsql:
        image: 'postgres:18-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './docker/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail
    # Local AWS emulator (S3 + Textract/SQS/Transcribe stubs). Replaces MinIO.
    # Compat image includes AWS CLI for ready.d bucket bootstrap.
    # Docker socket is required for the Floci UI and for spawning Lambda/RDS sidecars.
    floci:
        image: 'floci/floci:latest-compat'
        ports:
            - '${FORWARD_FLOCI_PORT:-4566}:4566'
        environment:
            FLOCI_HOSTNAME: floci
            FLOCI_STORAGE_MODE: persistent
            # Exercise Laravel's SES transport while retaining Mailpit's local inbox UI.
            FLOCI_SERVICES_SES_SMTP_HOST: mailpit
            FLOCI_SERVICES_SES_SMTP_PORT: 1025
            # Keep local S3 audit evidence available quickly instead of waiting 60 seconds.
            FLOCI_SERVICES_CLOUDTRAIL_FLUSH_INTERVAL_SECONDS: 5
            FLOCI_BOOTSTRAP_SES_DOMAIN: '${FLOCI_BOOTSTRAP_SES_DOMAIN:-qompose.test}'
            # Attach Floci-spawned containers to the Sail bridge network.
            FLOCI_SERVICES_DOCKER_NETWORK: '${COMPOSE_PROJECT_NAME:-platform}_sail'
        volumes:
            - 'sail-floci:/app/data'
            - './docker/floci/init/ready.d:/etc/floci/init/ready.d:ro'
            - '/var/run/docker.sock:/var/run/docker.sock'
        networks:
            - sail
        healthcheck:
            test:
                - CMD-SHELL
                - 'curl -sf http://localhost:4566/_localstack/health >/dev/null || exit 1'
            retries: 5
            timeout: 5s
            start_period: 10s
networks:
    sail:
        driver: bridge
volumes:
    sail-node-modules:
        driver: local
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
    sail-floci:
        driver: local
